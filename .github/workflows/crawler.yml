name: HKJC 賠率自動爬蟲

on:
  schedule:
    # 每天 UTC 00:00 執行（= 香港時間 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: 執行爬蟲
        run: python hkjc_crawler.py

      - name: 下載歷史資料
        uses: actions/download-artifact@v4
        with:
          name: odds-history
          path: data
        continue-on-error: true

      - name: 執行爬蟲
        run: python hkjc_crawler.py

      - name: 上傳當次結果
        uses: actions/upload-artifact@v4
        with:
          name: odds-data
          path: data/hkjc_odds_history.csv

      - name: 保存資料給下次使用
        uses: actions/upload-artifact@v4
        with:
          name: odds-history
          path: data/hkjc_odds_history.csv
